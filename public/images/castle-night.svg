<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Original art for Game Night: a castle on a hill under a moonlit sky. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a18"/>
      <stop offset="0.55" stop-color="#1a2348"/>
      <stop offset="0.85" stop-color="#3a3350"/>
      <stop offset="1" stop-color="#5a4434"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6e7c1" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#e2c98f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e2c98f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a4a"/>
      <stop offset="1" stop-color="#151a30"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1122"/>
      <stop offset="1" stop-color="#05060c"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d86a8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8d86a8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8d86a8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#f6e7c1">
    <circle cx="90" cy="70" r="1.6" opacity="0.8"/><circle cx="210" cy="150" r="1.1" opacity="0.6"/>
    <circle cx="330" cy="60" r="1.4" opacity="0.7"/><circle cx="420" cy="200" r="1" opacity="0.5"/>
    <circle cx="520" cy="110" r="1.8" opacity="0.8"/><circle cx="640" cy="40" r="1.2" opacity="0.6"/>
    <circle cx="760" cy="170" r="1" opacity="0.5"/><circle cx="880" cy="90" r="1.5" opacity="0.7"/>
    <circle cx="990" cy="30" r="1.1" opacity="0.6"/><circle cx="1080" cy="210" r="1.3" opacity="0.5"/>
    <circle cx="1450" cy="60" r="1.6" opacity="0.8"/><circle cx="1530" cy="180" r="1.1" opacity="0.6"/>
    <circle cx="1380" cy="250" r="1" opacity="0.5"/><circle cx="160" cy="270" r="1.2" opacity="0.5"/>
    <circle cx="700" cy="260" r="1.3" opacity="0.4"/><circle cx="40" cy="190" r="1" opacity="0.5"/>
    <circle cx="1560" cy="300" r="1.2" opacity="0.4"/><circle cx="950" cy="280" r="1" opacity="0.4"/>
  </g>

  <!-- Moon -->
  <circle cx="1220" cy="170" r="230" fill="url(#moonGlow)"/>
  <circle cx="1220" cy="170" r="62" fill="#f3e2b6"/>
  <circle cx="1196" cy="152" r="12" fill="#e2cd98" opacity="0.7"/>
  <circle cx="1238" cy="192" r="8" fill="#e2cd98" opacity="0.6"/>
  <circle cx="1246" cy="146" r="5" fill="#e2cd98" opacity="0.6"/>

  <!-- Far hills -->
  <path d="M0 610 C180 540 320 560 470 520 C640 475 760 540 900 520 C1060 498 1200 450 1380 500 C1480 528 1550 520 1600 505 L1600 900 L0 900 Z" fill="url(#far)"/>

  <!-- Mist -->
  <rect x="0" y="520" width="1600" height="160" fill="url(#mist)"/>

  <!-- Castle on the hill -->
  <g fill="#0b0e1d">
    <!-- hill -->
    <path d="M300 900 C420 760 560 700 760 690 C960 680 1120 730 1260 900 Z"/>
    <!-- curtain wall -->
    <rect x="560" y="560" width="420" height="140"/>
    <path d="M560 560 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 v-14 h20 v14 h20 z"/>
    <!-- left tower -->
    <rect x="520" y="470" width="80" height="230"/>
    <path d="M512 470 L560 390 L608 470 Z"/>
    <!-- right tower -->
    <rect x="940" y="480" width="80" height="220"/>
    <path d="M932 480 L980 400 L1028 480 Z"/>
    <!-- keep -->
    <rect x="690" y="430" width="160" height="270"/>
    <path d="M690 430 h16 v-16 h16 v16 h16 v-16 h16 v16 h16 v-16 h16 v16 h16 v-16 h16 v16 h16 v-16 h16 v16 z"/>
    <!-- keep spire -->
    <rect x="745" y="330" width="50" height="100"/>
    <path d="M738 330 L770 240 L802 330 Z"/>
    <rect x="768" y="210" width="3" height="32"/>
    <path d="M771 212 l26 7 l-26 7 z"/>
    <!-- small turrets -->
    <rect x="640" y="500" width="34" height="60"/>
    <path d="M636 500 L657 462 L678 500 Z"/>
    <rect x="870" y="505" width="34" height="55"/>
    <path d="M866 505 L887 468 L908 505 Z"/>
  </g>

  <!-- Lit windows and gate -->
  <g fill="#f0c66e">
    <rect x="552" y="500" width="10" height="18" rx="5" opacity="0.9"/>
    <rect x="552" y="560" width="10" height="18" rx="5" opacity="0.6"/>
    <rect x="975" y="515" width="10" height="18" rx="5" opacity="0.85"/>
    <rect x="740" y="470" width="12" height="22" rx="6" opacity="0.9"/>
    <rect x="788" y="470" width="12" height="22" rx="6" opacity="0.7"/>
    <rect x="765" y="360" width="10" height="20" rx="5" opacity="0.95"/>
    <rect x="652" y="520" width="8" height="14" rx="4" opacity="0.7"/>
    <rect x="882" y="525" width="8" height="14" rx="4" opacity="0.6"/>
    <path d="M745 700 v-48 a25 25 0 0 1 50 0 v48 z" opacity="0.45"/>
  </g>

  <!-- Near ground and trees -->
  <path d="M0 760 C200 720 360 770 520 800 C700 835 900 820 1080 790 C1260 760 1420 740 1600 770 L1600 900 L0 900 Z" fill="url(#near)"/>
  <g fill="#05060c">
    <path d="M90 790 l30 -110 l30 110 z"/><path d="M140 800 l24 -86 l24 86 z"/>
    <path d="M40 805 l20 -70 l20 70 z"/><path d="M1420 770 l32 -120 l32 120 z"/>
    <path d="M1480 780 l24 -90 l24 90 z"/><path d="M1370 785 l20 -70 l20 70 z"/>
  </g>
</svg>
